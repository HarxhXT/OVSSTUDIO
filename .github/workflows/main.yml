
name: OVS Studio APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'obs-studio/**'
      - 'deps-android/**'
      - 'scripts/**'
      - 'android-shell/**'
      - '.github/workflows/ovs-studio-build.yml'

permissions:
  contents: read

concurrency:
  group: ovs-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OVS Studio Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      NDK_VERSION: r30
      QT_VERSION: 6.11.1
      GRADLE_VERSION: '9.3.1'
      BUILD_TOOLS: 36.0.0
      PLATFORM: android-36
      DL_ROOT: ${{ github.workspace }}/../obs-dl

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            7zip ninja-build build-essential curl unzip zip \
            ca-certificates patch pkg-config dpkg-dev \
            autoconf automake libtool ccache \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libavcodec-dev \
            libavformat-dev libavutil-dev \
            libswscale-dev python3-pil

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: ovs-qt-${{ runner.os }}-${{ env.QT_VERSION }}

      - name: Install Qt
        run: |
          set -e
          QT_DIR="$HOME/Qt/$QT_VERSION"

          if [ ! -x "$QT_DIR/gcc_64/bin/androiddeployqt" ]; then
            pip install --quiet aqtinstall
            mkdir -p "$HOME/Qt"

            aqt install-qt all_os android \
              "$QT_VERSION" android_arm64_v8a -O "$HOME/Qt"

            aqt install-qt linux desktop \
              "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt"
          fi

          test -x "$QT_DIR/gcc_64/bin/androiddeployqt"

      - name: Cache compiler
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ovs-ccache-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ovs-ccache-${{ runner.os }}-

      - name: Cache Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps-android/src
            deps-android/prebuilt
          key: ovs-deps-${{ runner.os }}-${{ hashFiles('deps-android/versions.sh', 'deps-android/defs.sh', 'deps-android/build.sh', 'scripts/android-native-deps/*.patch') }}

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No release signing key configured."
            exit 0
          fi

          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' \
            | base64 -d > "$RUNNER_TEMP/release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env STORE_PASS \
            -alias "$KEY_ALIAS" >/dev/null

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build OVS Studio
        env:
          SIGN_KEYSTORE: ${{ steps.signing.outputs.available == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGN_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGN_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash scripts/ci-build-android.sh

      - name: Locate APK
        id: apk
        run: |
          set -e

          APK_FILE="$(cat build-fe-arm64-v8a-ci/.final-apk-path)"

          test -f "$APK_FILE"

          echo "path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK_FILE")" >> "$GITHUB_OUTPUT"

          echo "APK: $APK_FILE"
          sha256sum "$APK_FILE"

      - name: Upload OVS Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: OVS-Studio-APK-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## OVS Studio APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: ${{ steps.apk.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Architecture: arm64-v8a" >> "$GITHUB_STEP_SUMMARY"
          echo "Minimum Android: 10" >> "$GITHUB_STEP_SUMMARY"
          echo "Build completed." >> "$GITHUB_STEP_SUMMARY"
